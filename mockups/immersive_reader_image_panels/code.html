<!-- Top AppBar - Immersive/Minimalist -->
<header class="fixed top-0 w-full z-40 flex justify-between items-center px-4 bg-surface-container-high border-b border-outline-variant h-xl transition-all duration-300 opacity-90 hover:opacity-100">
<div class="flex items-center gap-md">
<button class="p-base hover:bg-surface-container-highest transition-colors rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-label-xs text-on-surface-variant uppercase tracking-wider">Solo Leveling</span>
<h1 class="font-h2 text-h2 text-on-surface">Chapter 42</h1>
</div>
</div>
<div class="flex items-center gap-sm">
<button class="px-md h-base flex items-center gap-xs font-label-sm text-label-sm border border-outline-variant hover:border-primary transition-all text-on-surface-variant hover:text-primary rounded-lg py-4">
<span class="material-symbols-outlined text-[18px]" data-icon="open_in_new">open_in_new</span>
<span>View Original Page</span>
</button>
<button class="p-base hover:bg-surface-container-highest transition-colors rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="auto_stories">auto_stories</span>
</button>
</div>
</header>
<!-- Reading Canvas -->
<main class="max-w-4xl mx-auto pt-[80px] pb-[160px] min-h-screen">
<div class="space-y-0">

<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="info">info</span>
<p class="text-on-surface-variant font-label-sm">High-performance reading mode active. All distractions removed.</p>
</div>
<button class="text-primary font-label-sm uppercase tracking-wider">Dismiss</button>
</div>
<!-- Content Area -->
<article class="flex flex-col w-full max-w-none gap-0">

</div>
</main>
<!-- Floating Reading Controls - Appears on tap/hover -->
<div class="fixed bottom-[80px] left-0 w-full z-40 flex justify-around items-center px-4 py-4">
<div class="max-w-4xl w-full flex items-center justify-between gap-xl">

<span class="block font-h2 text-h2 text-on-surface">Chapter 41</span>
</div>
</button>
<!-- Progress Indicator (Central) -->
<div class="hidden md:flex flex-col items-center gap-xs px-lg border-x border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md p-md rounded-xl">

<div class="w-32 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary-container"></div>
</div>
<span class="font-label-xs text-primary font-bold uppercase">32% Complete</span>
</div>
<!-- Next Button -->
<button class="flex-1 flex items-center justify-center gap-md py-4 px-lg bg-primary-container rounded-xl hover:opacity-90 transition-all active:scale-95 group shadow-lg">
<div class="text-right">
<span class="block font-label-xs text-label-xs text-on-primary-container opacity-80 uppercase tracking-widest">Next Chapter</span>
<span class="block font-h2 text-h2 text-on-primary-container">Chapter 43</span>
</div>
<span class="material-symbols-outlined text-on-primary-container group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>

<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>

<span class="material-symbols-outlined" data-icon="download">download</span>
<span class="font-label-xs">Downloads</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-xs">Settings</span>
</button>
</nav>
<!-- Side Control Overlay (Floating) -->
<div class="fixed right-6 top-1/2 -translate-y-1/2 flex flex-col gap-sm">
<div class="flex flex-col bg-surface-container-high border border-outline-variant rounded-full p-xs gap-xs">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="fit_screen">fit_screen</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined" data-icon="format_size">format_size</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined" data-icon="contrast">contrast</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined" data-icon="bookmarks" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bookmarks</span>
</button>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high border border-outline-variant text-on-surface-variant hover:text-primary hover:border-primary transition-all">
<span class="material-symbols-outlined" data-icon="vertical_align_top">vertical_align_top</span>
</button>
</div>
